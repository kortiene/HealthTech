# HealthTech — stack de production (ADR 0004/0005/0007).
#
# PRÉREQUIS :
#   1. Docker + Docker Compose installés sur le serveur.
#   2. Copier .env.example → .env et remplir toutes les valeurs.
#   3. Le réseau Docker "proxy" du companion doit exister sur le serveur.
#
# DÉMARRAGE (première fois — construit la PWA localement) :
#   docker compose --env-file infra/prod/.env -f infra/prod/compose.yaml up -d --build
#
# MISE À JOUR BACKEND :
#   docker compose --env-file infra/prod/.env -f infra/prod/compose.yaml pull backend
#   docker compose --env-file infra/prod/.env -f infra/prod/compose.yaml up -d backend
#
# MISE À JOUR PWA (après git pull) :
#   docker compose --env-file infra/prod/.env -f infra/prod/compose.yaml up -d --build pwa
#
# LOGS :
#   docker compose --env-file infra/prod/.env -f infra/prod/compose.yaml logs -f backend
#   docker compose --env-file infra/prod/.env -f infra/prod/compose.yaml logs -f pwa

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-healthtech}
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - internal

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY}
    volumes:
      - miniodata:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - internal

  backend:
    image: ghcr.io/kortiene/healthtech-backend:latest
    expose:
      - 8080
    environment:
      APP_ENV: prod
      BIND_ADDR: 0.0.0.0:8080
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-healthtech}
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY}
      PRESIGNED_URL_SIGNING_KEY: ${PRESIGNED_URL_SIGNING_KEY}
      VIRTUAL_HOST: ${BACKEND_DOMAIN}
      LETSENCRYPT_HOST: ${BACKEND_DOMAIN}
      LETSENCRYPT_EMAIL: devops@wozo.com
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - internal
      - proxy

  pwa:
    build:
      context: ../../app-medecin
      dockerfile: Dockerfile
    expose:
      - 80
    environment:
      VIRTUAL_HOST: ${PWA_DOMAIN}
      LETSENCRYPT_HOST: ${PWA_DOMAIN}
      LETSENCRYPT_EMAIL: devops@wozo.com
    restart: unless-stopped
    networks:
      - internal
      - proxy

volumes:
  pgdata:
  miniodata:

networks:
  internal:
    driver: bridge
  proxy:
    external: true
