# HealthTech — stack de production (ADR 0004/0005/0007).
#
# PRÉREQUIS :
#   1. Docker + Docker Compose installés sur le serveur.
#   2. Copier .env.example → .env et remplir toutes les valeurs.
#   3. Le serveur doit être physiquement en Côte d'Ivoire (ARTCI/ADR 0005).
#   4. Les domaines api.healthtech.ci et medecin.healthtech.ci pointent sur l'IP du serveur.
#
# DÉMARRAGE (première fois — construit la PWA localement) :
#   docker compose -f infra/prod/compose.yaml --env-file infra/prod/.env up -d --build
#
# MISE À JOUR BACKEND (image pre-built depuis ghcr.io) :
#   docker compose -f infra/prod/compose.yaml --env-file infra/prod/.env pull backend
#   docker compose -f infra/prod/compose.yaml --env-file infra/prod/.env up -d backend
#
# MISE À JOUR PWA (rebuild local après git pull) :
#   docker compose -f infra/prod/compose.yaml --env-file infra/prod/.env up -d --build pwa
#
# LOGS :
#   docker compose -f infra/prod/compose.yaml logs -f backend
#   docker compose -f infra/prod/compose.yaml logs -f pwa

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-healthtech}
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - internal

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY}
    volumes:
      - miniodata:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - internal

  backend:
    image: ghcr.io/kortiene/healthtech-backend:latest
    environment:
      APP_ENV: prod
      BIND_ADDR: 0.0.0.0:8080
      # Construit à partir des variables du .env — ne pas modifier ces lignes.
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-healthtech}
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY}
      PRESIGNED_URL_SIGNING_KEY: ${PRESIGNED_URL_SIGNING_KEY}
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - internal

  pwa:
    build:
      context: ../../app-medecin
      dockerfile: Dockerfile
    restart: unless-stopped
    networks:
      - internal

  caddy:
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - backend
      - pwa
    restart: unless-stopped
    networks:
      - internal

volumes:
  pgdata:
  miniodata:
  caddy_data:
  caddy_config:

# Réseau interne isolé : seul Caddy expose des ports vers l'extérieur.
# Le backend et les services de stockage ne sont pas accessibles directement.
networks:
  internal:
    driver: bridge
