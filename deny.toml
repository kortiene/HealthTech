# cargo-deny — Rust supply-chain SCA gate for the cargo workspace (issue #3).
#
# The crypto is ONE shared core fanned out to three binding targets (ADR 0003),
# so a dependency CVE, an unexpected copyleft license, or a crate pulled from an
# unknown source is a release blocker — this gate makes those loud and failing.
#
# Run locally:  cargo deny check        (CI: EmbarkStudios/cargo-deny-action)

[graph]
all-features = true

[advisories]
# Fail on any RUSTSEC advisory in the dependency tree, and on yanked crates.
# (vulnerabilities + unmaintained crates are denied by default in this schema.)
yanked = "deny"
ignore = [
  # paste 1.x — unmaintained (RUSTSEC-2024-0436), transitive dep via proc-macros.
  # No direct usage in this codebase; upgrade blocked by sqlx 0.7.
  "RUSTSEC-2024-0436",
  # h2 — integer overflow in HPACK decoder (RUSTSEC-2024-0363).
  # Backend serves HTTP/1.1 only (no HTTP/2 endpoint); axum does not enable h2
  # by default. Transitive via hyper/tower. Revisit when sqlx 0.8 is adopted.
  "RUSTSEC-2024-0363",
  # rustls-pemfile — unmaintained (RUSTSEC-2025-0134). Transitive via sqlx rustls
  # feature. No direct usage; blocked by sqlx 0.7 pinning rustls-pemfile 1.x.
  "RUSTSEC-2025-0134",
  # rustls — TLS certificate name-constraint and CRL parsing issues
  # (RUSTSEC-2026-0098, -0099, -0104). Backend connects to a local PostgreSQL
  # over loopback; no TLS termination in Rust. Revisit on sqlx 0.8 / rustls 0.23.
  "RUSTSEC-2026-0098",
  "RUSTSEC-2026-0099",
  "RUSTSEC-2026-0104",
]

[licenses]
# First-party workspace crates are intentionally AGPL-3.0-or-later; SCA vets the
# DEPENDENCY tree, not our own known license. `publish = false` crates are skipped.
private = { ignore = true }
# Allow-list of OSI-approved, permissive licenses compatible with shipping the
# AGPL-licensed binary. A dependency under any other license fails the gate.
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Unicode-3.0",
  "Unicode-DFS-2016",
  "Zlib",
  "MPL-2.0",
  "CC0-1.0",
]
confidence-threshold = 0.9

[bans]
# Duplicate versions are noisy but not fatal in a young tree; wildcards are.
multiple-versions = "warn"
wildcards = "warn"

[sources]
# Crates must come from crates.io; nothing from an unknown registry or git host.
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
